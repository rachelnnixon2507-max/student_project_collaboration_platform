server:
  port: 8080

spring:
  application:
    name: platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:$rachel@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT secret configuration
app:
  jwt:
    secret: ${JWT_SECRET:PlatformAdminSecretKeyForJwtTokenGeneration20261234567890!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h default
  admin:
    inactivity-threshold-days: ${INACTIVITY_THRESHOLD_DAYS:7}
    delay-grace-days: ${DELAY_GRACE_DAYS:0}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
